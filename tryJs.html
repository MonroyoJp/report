    <script>

        var uniqueInOrder=function(iterable){

        let iterableLength = iterable.length;
        let iterableLetters = [];
        let currentLetter;
        let nextLetter;
        
        for (let i = 0; i < iterableLength; i++){
            if(Array.isArray(iterable)){
                currentLetter = iterable[i];
                nextLetter = iterable[i + 1];
            }
            else{
                currentLetter = iterable.charAt(i);
                nextLetter = iterable.charAt(i + 1);
            }
                      
            if(currentLetter != nextLetter){
                iterableLetters.push(currentLetter);
            }
        };

        console.log(iterableLetters);
        }

        uniqueInOrder("AAAABBBCCDAABBB");
        uniqueInOrder("A");
        uniqueInOrder(1,2,3,3,4);
        uniqueInOrder([]);
        uniqueInOrder('ABBCcAD');
        uniqueInOrder([1,2,2,3,3]);

        function areYouPlayingBanjo(name) {
        let result = "";
        let playsBanjo = " plays banjo";
        name.charAt(0) == "r" || name.charAt(0) == "R" ? result = playsBanjo: result = " does not" + playsBanjo;
        return name + result;
        }

        console.log(areYouPlayingBanjo("Adam"));
        console.log(areYouPlayingBanjo("Paul"));
        console.log(areYouPlayingBanjo("Ringo"));
        console.log(areYouPlayingBanjo("bravo"));
        console.log(areYouPlayingBanjo("rolf"));
