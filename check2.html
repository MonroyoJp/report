<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Tab Popups</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    h2 { margin: 20px 0; }
    img#trigger {
      cursor: pointer;
      width: 80px;
      margin: 20px;
    }

    .popup {
      position: absolute;
      background: #fff;
      color: #000;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      overflow: hidden;
      opacity: 0;
      transform: scale(0.2);
      border: 1px solid #ccc;
    }
    .popup-header {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      cursor: move; /* shows grab cursor */
    }
    .popup-header img {
      width: 16px;
      height: 16px;
      margin-right: 8px;
    }
    .close-btn {
      margin-left: auto;
      cursor: pointer;
      font-weight: bold;
      padding: 0 6px;
    }
    .popup-body {
      padding: 20px;
      font-size: 14px;
      color: #333;
    }

    /* Browser-specific header colors */
    .chrome-header   { background: #4285f4; }
    .firefox-header  { background: #ff7139; }
    .safari-header   { background: #00a0ff; }
    .edge-header     { background: #0078d7; }
    .ie-header       { background: #1ebbee; }
  </style>
</head>
<body>
  <h2>Click the image to spawn browser homepage popups</h2>
  <img id="trigger" src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Trigger">

  <!-- Chrome -->
  <template id="chrome">
    <div class="popup">
      <div class="popup-header chrome-header">
        <img src="https://www.google.com/chrome/static/images/favicons/favicon-16x16.png">
        Chrome – New Tab
        <div class="close-btn">✖</div>
      </div>
      <div class="popup-body">
        <h3>Google</h3>
        <input type="text" placeholder="Search Google or type a URL" style="width:90%;padding:5px;">
      </div>
    </div>
  </template>

  <!-- Firefox -->
  <template id="firefox">
    <div class="popup">
      <div class="popup-header firefox-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Firefox_logo%2C_2019.svg">
        Firefox – New Tab
        <div class="close-btn">✖</div>
      </div>
      <div class="popup-body">
        <h3>Firefox Start Page</h3>
        <p>Top Sites · Highlights</p>
      </div>
    </div>
  </template>

  <!-- Safari -->
  <template id="safari">
    <div class="popup">
      <div class="popup-header safari-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg">
        Safari – Start Page
        <div class="close-btn">✖</div>
      </div>
      <div class="popup-body">
        <h3>Favorites</h3>
        <p>Frequently Visited · Privacy Report</p>
      </div>
    </div>
  </template>

  <!-- Edge -->
  <template id="edge">
    <div class="popup">
      <div class="popup-header edge-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/Microsoft_Edge_logo_%282019%29.svg">
        Edge – New Tab
        <div class="close-btn">✖</div>
      </div>
      <div class="popup-body">
        <h3>Microsoft Bing</h3>
        <p>News · Weather · Interests</p>
      </div>
    </div>
  </template>

  <!-- Internet Explorer -->
  <template id="ie">
    <div class="popup">
      <div class="popup-header ie-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Internet_Explorer_10_start_icon.svg">
        Internet Explorer – Home
        <div class="close-btn">✖</div>
      </div>
      <div class="popup-body">
        <h3>MSN Homepage</h3>
        <p>Breaking News · Outlook.com</p>
      </div>
    </div>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const trigger = document.getElementById("trigger");
    let isOpen = false;

    const coordsList = [
      { x:53,  y:277, w:333, h:220, id:"chrome" },
      { x:409, y:127, w:427, h:220, id:"firefox" },
      { x:912, y:156, w:313, h:220, id:"safari"  },
      { x:437, y:571, w:304, h:200, id:"edge"    },
      { x:786, y:451, w:311, h:200, id:"ie"      }
    ];

    trigger.addEventListener("click", () => {
      if (!isOpen) {
        coordsList.forEach((c, i) => spawnPopup(c, i));
        isOpen = true;
      } else {
        closeAllPopups();
        isOpen = false;
      }
    });

    function spawnPopup({x,y,w,h,id}, delayIndex) {
      const tmpl = document.getElementById(id);
      const popup = tmpl.content.firstElementChild.cloneNode(true);
      document.body.appendChild(popup);

      // initial at center
      const centerX = window.innerWidth/2 - w/2;
      const centerY = window.innerHeight/2 - h/2;
      popup.style.left = centerX+"px";
      popup.style.top = centerY+"px";
      popup.style.width = w+"px";
      popup.style.height = h+"px";

      anime({
        targets: popup,
        left: x+"px",
        top: y+"px",
        opacity: 1,
        scale: 1,
        easing: "easeOutBack",
        duration: 800,
        delay: delayIndex * 150
      });

      // Make draggable
      makeDraggable(popup);

      popup.querySelector(".close-btn").onclick = () => closePopup(popup, w, h);
    }

    function closePopup(popup, w, h) {
      const centerX = window.innerWidth/2 - w/2;
      const centerY = window.innerHeight/2 - h/2;
      anime({
        targets: popup,
        left: centerX+"px",
        top: centerY+"px",
        opacity: 0,
        scale: 0.2,
        easing: "easeInBack",
        duration: 500,
        complete: () => popup.remove()
      });
    }

    function closeAllPopups() {
      document.querySelectorAll(".popup").forEach(p => {
        const rect = p.getBoundingClientRect();
        closePopup(p, rect.width, rect.height);
      });
    }

    function makeDraggable(popup) {
      const header = popup.querySelector(".popup-header");
      let offsetX = 0, offsetY = 0, startX, startY, dragging = false;

      header.addEventListener("mousedown", (e) => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = popup.getBoundingClientRect();
        offsetX = startX - rect.left;
        offsetY = startY - rect.top;
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", stop);
      });

      function move(e) {
        if (!dragging) return;
        popup.style.left = (e.clientX - offsetX) + "px";
        popup.style.top  = (e.clientY - offsetY) + "px";
      }

      function stop() {
        dragging = false;
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", stop);
      }
    }
  </script>
</body>
</html>
