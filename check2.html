<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripple Effect Div</title>
  <style>
   
  </style>
</head>
<body>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

<div class="checkmate-modal" id="checkmateModal">
  <div class="checkmate-box">
    <div class="checkmate-header">
      <div class="checkmate-player">
        <img src="https://i.pravatar.cc/80?img=12" alt="Winner" class="player-avatar" id="winnerAvatar">
        <div class="player-info">
          <div class="player-name" id="winnerName">Player 1</div>
          <div class="player-status winner-status">Winner</div>
        </div>
      </div>

      <div class="vs-text">vs</div>

      <div class="checkmate-player">
        <img src="https://i.pravatar.cc/80?img=32" alt="Loser" class="player-avatar" id="loserAvatar">
        <div class="player-info">
          <div class="player-name" id="loserName">Player 2</div>
          <div class="player-status loser-status">Loser</div>
        </div>
      </div>
      
    </div>

    <div class="checkmate-body">
      <h2>Checkmate!</h2>
      <p id="matchTime">Match Time: 12:34</p>
    </div>

    <div class="checkmate-footer">
      <button id="checkmateOkBtn">OK</button>
    </div>
  </div>
</div>

<style>
body {
  font-family: 'Poppins', sans-serif;
}
.checkmate-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}
.checkmate-box {
  background: #fff;
  border-radius: 12px;
  width: 420px;
  max-width: 95%;
  padding: 20px 25px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.15);
  transform: scale(0.8);
  opacity: 0;
}
.checkmate-header {
  display: flex;
  align-items: center;
  justify-content: center; /* center everything properly */
  gap: 20px; /* even spacing between items */
}

.checkmate-player {
  display: flex;
  align-items: center;
  gap: 10px;
}

.vs-text {
  font-weight: 600;
  color: #999;
  font-size: 14px;
}

.player-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.player-info {
  display: flex;
  flex-direction: column;
}
.player-name {
  font-weight: 600;
  color: #222;
}
.player-status {
  font-size: 13px;
  font-weight: 500;
  margin-top: 4px;
}
.winner-status {
  color: #2e8b57;
}
.loser-status {
  color: #c0392b;
}
.vs-text {
  font-weight: 600;
  color: #999;
  font-size: 14px;
}
.checkmate-body {
  text-align: center;
  margin: 15px 0;
}
.checkmate-body h2 {
  font-size: 28px;
  font-weight: 700;
  margin: 0;
  color: #333;
}
.checkmate-body p {
  font-size: 14px;
  color: #666;
  margin-top: 8px;
}
.checkmate-footer {
  text-align: center;
  margin-top: 10px;
}
#checkmateOkBtn {
  background: #5166fa;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 25px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s ease;
}
#checkmateOkBtn:hover {
  background: #3f51d1;
}
</style>

<script>
function showCheckmateModal(winner, loser, winnerImg, loserImg, time) {
  const modal = document.getElementById('checkmateModal');
  document.getElementById('winnerName').textContent = winner;
  document.getElementById('loserName').textContent = loser;
  document.getElementById('winnerAvatar').src = winnerImg;
  document.getElementById('loserAvatar').src = loserImg;
  document.getElementById('matchTime').textContent = `Match Time: ${time}`;

  modal.style.display = "flex";

  anime({
    targets: ".checkmate-box",
    opacity: [0, 1],
    scale: [0.8, 1],
    easing: "easeOutBack",
    duration: 600
  });

  anime({
    targets: ".checkmate-player",
    translateY: [20, 0],
    opacity: [0, 1],
    delay: anime.stagger(120),
    duration: 400,
    easing: "easeOutCubic"
  });
}

document.getElementById('checkmateOkBtn').addEventListener('click', () => {
  anime({
    targets: ".checkmate-box",
    opacity: [1, 0],
    scale: [1, 0.8],
    easing: "easeInBack",
    duration: 400,
    complete: () => document.getElementById('checkmateModal').style.display = "none"
  });
});

// Example usage (you can trigger this after detecting checkmate)
showCheckmateModal("Player", "Coach David", "https://i.pravatar.cc/80?img=12", "https://i.pravatar.cc/80?img=32", "5:23");
</script>


</body>
</html>
