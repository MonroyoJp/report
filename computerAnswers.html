<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 3: Computer Components</title>
  <style>
    body { margin: 0; background: #e0e0e0; }
    canvas { display: block; }
    .caption {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div class="caption">
    <h2>Task 3: Labeling Activity</h2>
    <p>Rotate the model to view internal components of the system unit.</p>
  </div>

  <script type="module">
    import * as THREE from "./js/three.module.js";
    import { OrbitControls } from "./js/OrbitControls.js";
    import { GLTFLoader } from "./js/GLTFLoader.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f4);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Model Loader
    const loader = new GLTFLoader();
    loader.load(
      "./pc_system_unit_3d.glb",
      (gltf) => {

         console.log(gltf.scene); 
        const model = gltf.scene;
        model.scale.set(2, 2, 2);   // Increase size so it's more visible
        model.position.set(0, 0, 0);

        gltf.scene.traverse((child) => {
    console.log(child.name, child.type);
  });

        // Optional: auto-center model
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center); // Center the model at (0,0,0)

        scene.add(model);
        console.log("✅ Model loaded");

        // ====== DEBUG: Add bounding boxes to all meshes ======
  model.traverse((child) => {
    if (child.isMesh) {
      const helper = new THREE.BoxHelper(child, 0xff0000); // Red wireframe
      scene.add(helper);
    }
  });
      },
      undefined,
      (err) => console.error("❌ Error loading model:", err)
    );

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Responsive resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
