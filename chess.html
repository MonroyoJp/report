<!DOCTYPE html>
<html>
<head>
  <title>Energizer</title>
  <link rel="icon" type="image/png" href="img/online-game.png">
  <link rel="stylesheet" href="/chessboardjs-1.0.0/css/chessboard-1.0.0.css">
  <link rel="stylesheet" href="css/chess.style.css">
  <link rel="stylesheet" href="css/style.scss">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/foundicons/3.0.0/foundation-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">


  <style>

  </style>
</head>
<body>
    <div class="container">
      <div class="right">
        <canvas id="c"></canvas>
        <div class="center menu">
            <div id="myMenu"></div>
        </div>

        <div class="right_wrapper">
          <div class="main__puzzle"></div>
          <div class="moon_below"></div>
          <div class="moon__reflection"></div>
          <p class="energizer__title">Chess Puzzle Energizer</p>
          <p class="energizer__description">Each correct moves unlock a piece of puzzle. Collect all to complete the puzzle and discover what it holds.</p>

          
        </div>
        
      </div>
      <div class="left">
        <div class="opponent">
          <img src="img/coachdavid.png" alt="coachdavid" height="30" style="border-radius: 60%; border: 1px solid #000;"> 
          <p class="name">Coach David</p>
          <div class="captured__pieces__opponent"></div>
          <div class="clock" id="blackClock"><span class="bmins">2: </span><span class="bsecs">59s</span></div>
        </div>
        <div id="board"></div>

        <div class="progress-vertical">
          <div class="progress-fill"></div>
          <canvas id="progressParticles"></canvas>
        </div>


  
        <div class="player">
          <img src="img/horse.png" alt="coachdavid" height="30" style="border-radius: 60%; border: 1px solid #000;"> 
          <p class="player__name">Player Name</p>
          <div class="player__captured__piece"></div>
          <div class="clock" id="whiteClock"><span class="wmins">2: </span><span class="wsecs">59s</span></div>
        </div>


      </div>

    </div>
 


  <!-- jQuery (required for chessboard.js) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- chessboard.js -->
  <script src="/chessboardjs-1.0.0/js/chessboard-1.0.0.js"></script>

    <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- jQuery UI (needed for .draggable) -->
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">


  <!-- chess.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="js/anime.min.js"></script>
  <script src="js/chess.logic.js"></script>
  <script src="js/draggable.menu.js"></script>


  <audio id="moveSound" src="audio/move-self.mp3"></audio>
  <audio id="captureSound" src="audio/capture.mp3"></audio>
  <audio id="checkSound" src="audio/move-check.mp3"></audio>
  <audio id="mateSound" src="audio/game-end.mp3"></audio>
  <audio id="incorrectSound" src="audio/incorrect-2-15.mp3"></audio>

</body>
</html>
